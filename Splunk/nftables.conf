#!/usr/sbin/nft -f

flush ruleset

table inet filter {

    # Set definitions without 'flags interval' for OL7 kernel compatibility
    set blacklist {
        type ipv4_addr
        elements = {
            192.0.2.1
        }
    }

    set whitelist {
        type ipv4_addr
        elements = {
            192.0.2.1
        }
    }

    chain input {
        type filter hook input priority 0;
        policy accept;

        # LOCAL CONNECTION
        iif "lo" accept

        # SPECIAL RULES
        ct state established, related accept
        ip saddr @whitelist accept
        ip saddr @blacklist drop

        # ICMP/ICMPv6 CONNECTION
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # SPLUNK PORTS (Individual rules for OL7 kernel compatibility)
        tcp dport 8000 accept
        tcp dport 8089 accept
        tcp dport 9997 accept
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}