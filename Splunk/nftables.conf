flush ruleset

table ip filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state established,related accept

        ip saddr 192.0.2.1 drop
        ip saddr 198.51.100.1 accept

        tcp dport {8000, 8089, 9997} accept
        tcp sport {8000, 8089, 9997} accept

    }
}