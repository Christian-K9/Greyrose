flush ruleset;

table ip filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # 1. Baseline Rules (Loopback and Existing Connections)
        iifname "lo" accept;
        ct state established,related accept;

        # 2. Hardcoded Blacklist (Add specific IPs you want to block here)
        ip saddr 192.168.1.50 drop;
        ip saddr 192.168.1.99 drop;
        ip saddr 10.0.0.0/24 drop;

        # 3. Publicly Accepted Ports (Open to everyone)
        tcp dport 80 accept;
        tcp dport 443 accept;

        # 4. Whitelisted Ports (Open ONLY to a trusted IP)
        ip saddr 203.0.113.10 tcp dport 22 accept;
    }
}

