#!/usr/sbin/nft -f

flush ruleset

table inet filter {

    set blacklist {
        type ipv4_addr;
        elements = {
            192.0.2.1
        };
    }

    set whitelist {
        type ipv4_addr;
        elements = {
            192.0.2.1
        };
    }

    chain input {
        type filter hook input priority 0; policy accept;

        # Local loopback
        iif "lo" accept;

        # Connection state tracking & IP filtering
        ct state established,related accept;
        ip saddr @blacklist drop;
        ip saddr @whitelist accept;

        # Allowed ports
        tcp dport { 8000, 8089, 9997 } accept;

        # ICMP
        ip protocol icmp accept;
        ip6 nexthdr icmpv6 accept;
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}