#!/usr/sbin/nft -f

flush ruleset

table inet filter {

	#NOTE: 192.0.2.2 Is a placeholder, IF NEEDED REMOVE IT

	set blacklist {
			type ipv4_addr
			flags interval
			elements = {
				# START: ACCEPTED IP CONNECTIONS
				192.0.2.1,
				# END: BLOCKED IP CONNECTIONS
			}
		}
	set whitelist {
			type ipv4_addr
			flags interval
			elements = {
					# START: ACCEPTED IP CONNECTIONS
					192.0.2.1,
					# END: ACCEPTED IP CONNECTIONS
				}
		}
    chain input {
	        type filter hook input priority 0;
	        policy accept;
	
	        # START: LOCAL CONNECTION
	        iif "lo" accept
			# END: LOCAL CONNECTION
	
	        # START: ACCEPTED INSIDE PORT CONNECTIONS
			tcp dport 80 accept
			tcp dport 443 accept
		    tcp dport 9997 accept
			tcp sport 9997 accept
			tcp dport 53 accept
			udp dport 53 accept
			# END: ACCEPTED INSIDE PORT CONNECTION
		
			# START: DENIED INSIDE PORT CONNECTIONS
			tcp dport 22 drop
			# END: DENIED INSIDE PORT CONNECTIONS
	
	
	        # START: ICMP/ICMPv6 CONNECTION
	        ip protocol icmp accept
	        ip6 nexthdr icmpv6 accept
			# END: ICMP/ICMPv6 CONNECTION
	
			# START: SPECIAL RULES
			ct state established, related accept
			ip saddr @whitelist accept
			ip saddr @blacklist drop
			# END: SPECIAL RULES
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
