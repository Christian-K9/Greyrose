#!/usr/sbin/nft -f

flush ruleset

table inet filter {

	# NOTE: 192.0.2.1 is a placeholder, IF NEEDED REMOVE IT

	set blacklist {
		type ipv4_addr
		flags interval
		elements = {
			# START: BLOCKED IP CONNECTIONS
			192.0.2.1,
			# END: BLOCKED IP CONNECTIONS
		}
	}

	set whitelist {
		type ipv4_addr
		flags interval
		elements = {
			# START: ACCEPTED IP CONNECTIONS
			192.0.2.1,
			# END: ACCEPTED IP CONNECTIONS
		}
	}

	chain input {
		type filter hook input priority 0;
		policy accept;

		# START: LOCAL CONNECTION
		iif "lo" accept
		# END: LOCAL CONNECTION

		# START: ACCEPTED PORT CONNECTIONS
		# END: ACCEPTED PORT CONNECTION

		# START: DENIED PORT CONNECTIONS
		# END: DENIED PORT CONNECTIONS

		# START: ICMP/ICMPv6 CONNECTION
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept
		# END: ICMP/ICMPv6 CONNECTION

		# START: SPECIAL RULES
		ct state established, related accept
		ip saddr @whitelist accept
    	ip saddr @blacklist drop
		# END: SPECIAL RULES
	}

	chain forward {
		type filter hook forward priority 0;
		policy drop;
	}

	chain output {
		type filter hook output priority 0;
		policy accept;
	}
}
