#!/usr/sbin/nft -f

flush ruleset

table inet filter {

	set blacklist {
		type ipv4_addr
		flags interval
		elements = {
			198.51.100.1,
		}
	}

	set whitelist {
		type ipv4_addr
		flags interval
		elements = {
			192.0.2.1,
		}
	}

	chain input {
		type filter hook input priority 0;
		policy drop; # DEFAULT DROP: Blocks all ports by default!

		# 1. Immediate Blacklist Drop (Drop before evaluating anything else)
		ip saddr @blacklist drop

		# 2. Allow Loopback Traffic
		iif "lo" accept

		# 3. Allow Established & Related Connections (Stateful Inspection)
		ct state established, related accept
		ct state invalid drop

		# 4. Whitelisted IPs (Bypasses port restrictions for specific admin IPs)
		ip saddr @whitelist accept

		# 5. ICMP (Ping)
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept

		# START: ACCEPTED PORT CONNECTIONS

		# END: ACCEPTED PORT CONNECTIONS

		# START: DENIED PORT CONNECTIONS

		# END: DENIED PORT CONNECTIONS

		# Everything else hits the default 'policy drop' here!
	}

	chain forward {
		type filter hook forward priority 0;
		policy drop;
	}

	chain output {
		type filter hook output priority 0;
		policy accept;
	}
}